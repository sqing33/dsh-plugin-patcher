# Bundle patch for dsh-plugin-patcher.
# The row id is also this plugin's settings namespace, so the client settings
# page can address the patch spec without a second name to keep in sync.
# An empty config is correct: the ladder is a pure function of the five-rung
# defaults, and an empty spec list simply means "nothing is bound yet".

- insert:
    - id: dsh-plugin-patcher
      name: dsh-plugin-patcher
      config: {}
